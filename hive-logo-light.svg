<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Hive logo light version">
  <defs>
    <linearGradient id="bgLight" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80ecff" stop-opacity="0.8"/>
      <stop offset="32%" stop-color="#6b7cff" stop-opacity="0.72"/>
      <stop offset="68%" stop-color="#ff76d8" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#ff76d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexLight" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1830"/>
      <stop offset="30%" stop-color="#214390"/>
      <stop offset="70%" stop-color="#293f8d"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <filter id="glowFilterLight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bgLight)"/>
  <circle cx="420" cy="180" r="180" fill="url(#glowLight)" opacity="0.9"/>

  <g transform="translate(80 40)" filter="url(#glowFilterLight)">
    <polygon points="120,0 220,60 220,180 120,240 20,180 20,60" fill="none" stroke="url(#hexLight)" stroke-width="12"/>
    <polygon points="120,28 188,68 188,172 120,212 52,172 52,68" fill="rgba(21,30,52,0.04)" stroke="rgba(10,14,25,0.55)" stroke-width="2"/>
    <path d="M120 62 L168 90 L168 146 L120 174 L72 146 L72 90 Z" fill="url(#hexLight)" opacity="0.96"/>
    <path d="M120 90 L145 106 L145 140 L120 156 L95 140 L95 106 Z" fill="#f7fbff" opacity="0.94"/>
    <path d="M116 119 L120 116 L124 119 L120 123 Z" fill="#111111"/>
    <path d="M90 118 L120 96 L150 118" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="#101827" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="6">
    <text x="420" y="170" font-size="118">HIVE</text>
    <text x="426" y="220" font-size="24" fill="#465c9d" letter-spacing="8">BUILD • SHIP • AMPLIFY</text>
  </g>

  <g opacity="0.9">
    <circle cx="990" cy="92" r="7" fill="#1aaed8"/>
    <circle cx="1026" cy="92" r="7" fill="#4559d4"/>
    <circle cx="1062" cy="92" r="7" fill="#ff5edb"/>
    <path d="M936 258 L1008 214 L1078 258" fill="none" stroke="#24459a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M1000 258 L1036 226 L1072 258" fill="none" stroke="#ff5edb" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
