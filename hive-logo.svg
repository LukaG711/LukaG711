<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Hive logo dark version">
  <defs>
    <linearGradient id="bgDark" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="35%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#4a7cff" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8d5bff" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#8d5bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexDark" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#77f7ff"/>
      <stop offset="25%" stop-color="#4ec7ff"/>
      <stop offset="60%" stop-color="#6c74ff"/>
      <stop offset="100%" stop-color="#ff6edb"/>
    </linearGradient>
    <filter id="glowFilterDark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bgDark)"/>
  <circle cx="420" cy="180" r="180" fill="url(#glowDark)" opacity="0.9"/>

  <g transform="translate(80 40)" filter="url(#glowFilterDark)">
    <polygon points="120,0 220,60 220,180 120,240 20,180 20,60" fill="none" stroke="url(#hexDark)" stroke-width="12"/>
    <polygon points="120,28 188,68 188,172 120,212 52,172 52,68" fill="rgba(159,200,255,0.08)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <path d="M120 62 L168 90 L168 146 L120 174 L72 146 L72 90 Z" fill="url(#hexDark)" opacity="0.96"/>
    <path d="M120 90 L145 106 L145 140 L120 156 L95 140 L95 106 Z" fill="#080d18" opacity="0.88"/>
    <path d="M116 119 L120 116 L124 119 L120 123 Z" fill="#f7fbff"/>
    <path d="M90 118 L120 96 L150 118" fill="none" stroke="#dff7ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="6">
    <text x="420" y="170" font-size="118">HIVE</text>
    <text x="426" y="220" font-size="24" fill="#9ab6ff" letter-spacing="8">BUILD • SHIP • AMPLIFY</text>
  </g>

  <g opacity="0.92">
    <circle cx="990" cy="92" r="7" fill="#72f3ff"/>
    <circle cx="1026" cy="92" r="7" fill="#7b81ff"/>
    <circle cx="1062" cy="92" r="7" fill="#ff7ee2"/>
    <path d="M936 258 L1008 214 L1078 258" fill="none" stroke="#82d7ff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M1000 258 L1036 226 L1072 258" fill="none" stroke="#ff7ee2" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
